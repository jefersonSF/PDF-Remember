
name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./PDFViewLastReadedPage/PDFViewLastReadedPage.csproj

      - name: Build application
        run: |
          dotnet build ./PDFViewLastReadedPage/PDFViewLastReadedPage.csproj `
          --configuration Release `
          --no-restore

      - name: Publish application
        run: |
          dotnet publish ./PDFViewLastReadedPage/PDFViewLastReadedPage.csproj `
          --configuration Release `
          --no-build `
          --output ./publish

      - name: Create ZIP package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          Compress-Archive `
            -Path "./publish/*" `
            -DestinationPath "./artifacts/PDFViewLastReadedPage-$env:GITHUB_REF_NAME.zip" `
            -Force

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "artifacts/PDFViewLastReadedPage-$env:GITHUB_REF_NAME.zip" `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes
